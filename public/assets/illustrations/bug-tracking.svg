<svg
  xmlns="http://www.w3.org/2000/svg"
  width="100%"
  height="100%"
  viewBox="0 0 120 80"
  preserveAspectRatio="xMidYMid meet"
  fill="none"
  role="img"
>
  <title>Animated bug tracker illustration</title>
  <style>
    svg { cursor: pointer; overflow: visible; }
    @media (prefers-reduced-motion: no-preference) {
      #bug-body { transform-origin: 60px 50px; }
      .space-template-card-container:hover #bug-body { animation: bug-wiggle 0.6s ease-in-out 0.05s infinite alternate; }
      @keyframes bug-wiggle {
        0%   { transform: rotate(0deg) translateY(0); }
        30%  { transform: rotate(-2deg) translateY(-2px); }
        60%  { transform: rotate(2deg) translateY(-1px); }
        100% { transform: rotate(-1deg) translateY(-3px); }
      }

      #antenna-left  { transform-origin: 54.6px 21.6px; transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
      .space-template-card-container:hover #antenna-left { animation: antenna-twitch 0.4s ease 0.1s infinite alternate; }
      @keyframes antenna-twitch { 0% { transform: rotate(0deg); } 100% { transform: rotate(-12deg); } }

      #antenna-right { transform-origin: 66.2px 21.6px; transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
      .space-template-card-container:hover #antenna-right { animation: antenna-twitch-r 0.4s ease 0.15s infinite alternate; }
      @keyframes antenna-twitch-r { 0% { transform: rotate(0deg); } 100% { transform: rotate(12deg); } }

      #leg-tl { transform-origin: 30.65px 32.5px; }
      .space-template-card-container:hover #leg-tl { animation: leg-wave 0.35s ease 0s infinite alternate; }
      #leg-tr { transform-origin: 90.24px 32.5px; }
      .space-template-card-container:hover #leg-tr { animation: leg-wave-r 0.35s ease 0.05s infinite alternate; }
      #leg-ml { transform-origin: 30.65px 48.5px; }
      .space-template-card-container:hover #leg-ml { animation: leg-wave 0.4s ease 0.1s infinite alternate; }
      #leg-mr { transform-origin: 90.24px 48.5px; }
      .space-template-card-container:hover #leg-mr { animation: leg-wave-r 0.4s ease 0.15s infinite alternate; }
      #leg-bl { transform-origin: 30.65px 64.5px; }
      .space-template-card-container:hover #leg-bl { animation: leg-wave 0.45s ease 0.2s infinite alternate; }
      #leg-br { transform-origin: 90.24px 64.5px; }
      .space-template-card-container:hover #leg-br { animation: leg-wave-r 0.45s ease 0.25s infinite alternate; }
      @keyframes leg-wave   { 0% { transform: rotate(0deg); } 100% { transform: rotate(-10deg); } }
      @keyframes leg-wave-r { 0% { transform: rotate(0deg); } 100% { transform: rotate(10deg); } }

      #red-x { transform-origin: 60.45px 49.06px; transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
      .space-template-card-container:hover #red-x { animation: x-pulse 0.5s ease 0.1s infinite alternate; }
      @keyframes x-pulse { 0% { transform: scale(1); } 100% { transform: scale(1.08) rotate(2deg); } }
    }
  </style>

  <defs>

<div class="edit-description-content" appClickOutside>
    <text-field class="description" [(value)]="val"></text-field>
    <div class="edit-description-btn-container">
        <button class="icon-btn edit-description-btn" [disabled]="val().length === 0" (click)="setValue.emit(val())">
            <span class="icon-content">
                <img src="./assets/icons/check.svg" alt="">
            </span>
        </button>
        <button class="icon-btn edit-description-btn" (click)="close.emit()">
            <span class="icon-content">
                <img src="./assets/icons/close.svg" alt="">
            </span>
        </button>
    </div>
</div>

<div class="card-contents">
  <div class="card-details card-item-description">
    <div class="card-item-description-2">
      <div class="non-edit-description-content" [class.isHidden]="isEditing()">
        <span class="description">{{issue()?.summary}}</span>
        <span class="edit-description-btn-container">
          <button class="icon-btn edit-description-btn" (click)="isEditing.set(true)">
            <span class="icon-content">
              <img src="./assets/icons/editSquare.svg" alt="" />
            </span>
          </button>
        </span>
      </div>
      <div class="edit-description-content" [class.isHidden]="!isEditing()">
        <text-field class="description" [(value)]="summary"></text-field>
        <div class="edit-description-btn-container">
          <button class="icon-btn edit-description-btn">
            <span class="icon-content">
              <img src="./assets/icons/check.svg" alt="" (click)="updateSummary()">
            </span>
          </button>
          <button class="icon-btn edit-description-btn" (click)="isEditing.set(false)">
            <span class="icon-content">
              <img src="./assets/icons/close.svg" alt="">
            </span>
          </button>
        </div>
      </div>
    </div>
  </div>
  <div class="card-details card-item-details">
    <button class="icon-btn tool-btn status">
      <span class="icon-content-container">
        <div class="icon-content">
          <img src="./assets/icons/checkOutlineSquare.svg" alt="icon" />
        </div>
      </span>
      <span class="text">DS-1</span>
    </button>
    <button class="icon-btn tool-btn status"></button>
    <button class="icon-btn tool-btn assignee">
      <span class="icon-content">
        <img src="./assets/icons/person.svg" alt="icon" />
      </span>
    </button>
  </div>
</div>
<div class="card-options">
  <button class="icon-btn card-option-btn" (click)="onCardOptionClick(cardOptionBtn)" #cardOptionBtn>
    <span class="icon-content">
      <img src="./assets/icons/more.svg" alt="icon" />
    </span>
  </button>
</div>

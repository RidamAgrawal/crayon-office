<div class="space-details">
  <div class="space-details-content">
    <span class="text">Space</span>
  </div>
  <div class="space-details-content">
    <img [src]="spaceDetail()?.icon" />
    <h1 class="space-name">{{ spaceDetail()?.name }}</h1>
    <div class="options">
      <!-- <button class="secondary-btn">
                <span>
                    <img src="./assets/icons/personAdd.svg" alt="icon">
                </span>
            </button> -->
      <button class="secondary-btn" (click)="onOptionsClick($event)">
        <span>
          <img src="./assets/icons/more.svg" alt="icon" />
        </span>
      </button>
    </div>
    <div class="extras">
      <button class="secondary-btn" (click)="onExpandClick()">
        <span>
          <img [src]="isTabsCollapsed() ? './assets/icons/closeFullscreen.svg' : './assets/icons/openInFull.svg'" alt="icon" />
        </span>
      </button>
    </div>
  </div>
</div>
<nav class="spaces-nav" [class.is-collapsed]="isTabsCollapsed()">
  <ul class="spaces-nav-item-container">
    @for (navItem of spaceNavs(); track $index) {
      <li class="spaces-nav-item" [id]="navItem.id">
        <a
          [routerLink]="[navItem.routerLink]"
          [routerLinkActiveOptions]="{ exact: true }"
          routerLinkActive="selected"
          class="spaces-nav-item-content"
        >
          <h2 class="spaces-view-text">
            <div class="spaces-view-icon">
              <img [src]="`./assets/icons/${navItem.icon}.svg`" />
            </div>
            <span>{{ navItem.label }}</span>
          </h2>
          <div class="spaces-view-options">
            <button
              class="spaces-view-options-btn"
              (click)="onNavOptionsClick($event, navItem.optionsList)"
            >
              <img src="./assets/icons/more.svg" />
            </button>
          </div>
        </a>
      </li>
    }
  </ul>
  <div class="more-views">
    <button class="more-view-btn" (click)="onMoreNavClick(moreNavBtn)" #moreNavBtn>
      <span class="more-view-btn-content">
        <span class="more-view-icon-container">
          <img src="./assets/icons/add2.svg" />
        </span>
      </span>
    </button>
  </div>
</nav>

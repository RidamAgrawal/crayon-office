<div class="content-header">
    <h1 class="header-title">
        <span>Create</span>
    </h1>
    <div class="header-options">
        <ul class="header-options-list">
            <li class="header-option-item">
                <app-icon-container>
                    <img class="icon-content" [src]="'assets/icons/add1.svg'" alt="add" />
                </app-icon-container>
            </li>
            <li class="header-option-item">
                <app-icon-container>
                    <img class="icon-content" [src]="'assets/icons/newTab.svg'" alt="new" />
                </app-icon-container>
            </li>
            <li class="header-option-item">
                <app-icon-container>
                    <img class="icon-content" [src]="'assets/icons/more.svg'" alt="more" />
                </app-icon-container>
            </li>
            <li class="header-option-item">
                <app-icon-container>
                    <img class="icon-content" [src]="'assets/icons/close.svg'" alt="close" />
                </app-icon-container>
            </li>
        </ul>
    </div>
</div>
<div class="content-body" appScrollBorder [formGroup]="createWorkItemForm">
    <div class="content-container-1">
        <div class="content-container-2">
            {{createWorkItemForm.value | json}}
            <p class="info-indicator">
                Required fields are marked with asterisk
                <span class="red-asterisk">*</span>
            </p>
            <div class="field-wrapper">
                <label for="" class="field-label">
                    Space <span class="red-asterisk">*</span>
                </label>
                <app-multi-select></app-multi-select>
            </div>
            <multi-select-wrapper label="Work type" [optionsConfig]="workTypeConfig"
                formControlName="workType"></multi-select-wrapper>
            <!-- <div class="item-placeholder-wrapper">
            <div class="item-placeholder-label"></div>
            <div class="item-placeholder-row-1"></div>
            <div class="item-placeholder-row-2"></div>
          </div> -->
            <hr class="field-divider">
            <div class="field-wrapper select-field-wrapper">
                <label for="type" class="field-label">
                    Status
                </label>
                <app-multi-select></app-multi-select>
                <div class="info-container font-body-small">
                    This is initial status of the work item
                </div>
            </div>
            <div class="section-2">
                <div class="field-wrapper text-field-wrapper">
                    <label for="" class="field-label">
                        Work type <span class="red-asterisk">*</span>
                    </label>
                    <div class="text-field">
                        <input type="text" class="text-field-input">
                    </div>
                    <div class="field-feedback-container font-body-small">
                        <app-icon-container>
                            <img src="assets/icons/feedback.svg" alt="icon">
                        </app-icon-container>
                        <span>
                            This field is required
                        </span>
                    </div>
                </div>
                <div class="field-wrapper multi-purpose-field-wrapper">
                    <label for="" class="field-label">Description</label>
                    <div class="multipurpose-field class='_1bsbhi17 _19pknek2 _n3td11zn'">
                        <wysiwyg2></wysiwyg2>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="content-footer">
    <app-checkbox class="create-another-checkbox" [checkboxConfig]="{title: 'create another'}"></app-checkbox>
    <button class="cancel-btn"><span>Cancel</span></button>
    <button class="save-btn" [disabled]="createWorkItemForm.invalid"><span>Create</span></button>
</div>

<div class="login-card">
  <div class="login-header">
    <svg class="jira-logo" height="40" viewBox="0 0 77 32" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path fill="#1868DB" d="M7.967 21.323H5.748C2.401 21.323 0 19.273 0 16.271h11.933c.618 0 1.018.44 1.018 1.062V29.34c-2.983 0-4.984-2.416-4.984-5.784zm5.894-5.967h-2.22c-3.346 0-5.747-2.013-5.747-5.015h11.932c.618 0 1.055.402 1.055 1.025v12.007c-2.983 0-5.02-2.416-5.02-5.784zm5.93-5.93h-2.22c-3.347 0-5.748-2.05-5.748-5.052h11.933c.618 0 1.019.439 1.019 1.025v12.007c-2.983 0-4.984-2.416-4.984-5.784z"></path>
      <path fill="#101214" d="M65.023 17.874c0 3.68 1.472 5.52 4.202 5.52 2.36 0 4.477-1.503 4.477-4.907V17.26c0-3.404-1.932-4.906-4.17-4.906-2.975 0-4.509 1.962-4.509 5.52m8.679 7.666v-2.76c-.981 2.024-2.821 3.067-5.183 3.067-4.078 0-6.133-3.465-6.133-7.973 0-4.324 2.147-7.974 6.44-7.974 2.239 0 3.956 1.012 4.876 3.006v-2.699h2.637V25.54zM55.91 16.493v9.047h-2.577V10.207h2.576v2.698c.89-1.809 2.423-3.097 5.428-2.913v2.576c-3.373-.337-5.428.675-5.428 3.925M46.224 6.159c0-1.165.767-1.84 1.84-1.84s1.84.675 1.84 1.84-.767 1.84-1.84 1.84-1.84-.675-1.84-1.84m.49 19.381V10.207h2.638V25.54zm-6.427-5.95V5.393h2.76v14.015c0 3.71-1.626 6.256-5.428 6.256-1.442 0-2.546-.246-3.312-.522v-2.668c.828.338 1.84.522 2.852.522 2.33 0 3.128-1.41 3.128-3.404"></path>
    </svg>
    <h5>Log in to continue</h5>
  </div>

  <div class="login-body">
    <div class="form-group">
      <label for="email">Email <span class="required">*</span></label>
      <text-field [(value)]="email" [placeholder]="'Enter Email'" [validatorFn]="validateEmail"></text-field>
    </div>

  <div class="login-body">
    <div class="form-group">
      <label for="password">Password <span class="required">*</span></label>
      <text-field [(value)]="password" [placeholder]="'Enter Password'" [validatorFn]="validatePassword"></text-field>
    </div>

    <div class="remember-me">
      <app-checkbox [checkboxConfig]="rememberMeConfig" [(ngModel)]="rememberMe"></app-checkbox>
      <span class="info-icon" title="Keep me logged in on this device">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <circle cx="8" cy="8" r="7.5" stroke="#6554C0" fill="#6554C0"/>
          <text x="8" y="12" text-anchor="middle" fill="white" font-size="11" font-weight="bold">i</text>
        </svg>
      </span>
    </div>

    <button class="continue-btn" (click)="onClick()" [disabled]="isLoginDisabled()">Log in</button>

    <div class="divider-text">Or login with:</div>

    <button class="social-btn">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <path d="M11.25 3.75C11.25 3.06 10.69 2.5 10 2.5S8.75 3.06 8.75 3.75V7.5c0 .35-.14.68-.39.92L6.88 9.88l1.25 1.25L10 9.38l1.88 1.75 1.25-1.25-1.49-1.46A1.25 1.25 0 0 1 11.25 7.5V3.75Z" fill="#1E1F21"/>
        <path d="M10 12.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5Z" fill="#1E1F21"/>
      </svg>
      <span>Passkey</span>
    </button>

    <div class="divider-text">Or continue with:</div>

    <button class="social-btn">
      <svg width="20" height="20" viewBox="0 0 20 20">
        <path d="M19.6 10.23c0-.68-.06-1.36-.18-2.02H10v3.83h5.38a4.6 4.6 0 0 1-2 3.02v2.5h3.24c1.89-1.74 2.98-4.3 2.98-7.33z" fill="#4285F4"/>
        <path d="M10 20c2.7 0 4.96-.9 6.62-2.44l-3.24-2.5c-.9.6-2.04.95-3.38.95-2.6 0-4.8-1.76-5.58-4.12H1.08v2.58A9.99 9.99 0 0 0 10 20z" fill="#34A853"/>
        <path d="M4.42 11.89a6 6 0 0 1 0-3.78V5.53H1.08a10 10 0 0 0 0 8.94l3.34-2.58z" fill="#FBBC05"/>
        <path d="M10 3.96c1.47 0 2.78.5 3.82 1.5l2.86-2.86A9.96 9.96 0 0 0 10 0 9.99 9.99 0 0 0 1.08 5.53l3.34 2.58C5.2 5.72 7.4 3.96 10 3.96z" fill="#EA4335"/>
      </svg>
      <span>Google</span>
    </button>

    <button class="social-btn">
      <svg width="20" height="20" viewBox="0 0 20 20">
        <rect x="1" y="1" width="8.5" height="8.5" fill="#F25022"/>
        <rect x="10.5" y="1" width="8.5" height="8.5" fill="#7FBA00"/>
        <rect x="1" y="10.5" width="8.5" height="8.5" fill="#00A4EF"/>
        <rect x="10.5" y="10.5" width="8.5" height="8.5" fill="#FFB900"/>
      </svg>
      <span>Microsoft</span>
    </button>

    <button class="social-btn">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="#000">
        <path d="M15.07 10.59c-.02-2.15 1.75-3.18 1.83-3.23-1-1.46-2.55-1.66-3.1-1.68-1.32-.13-2.57.78-3.24.78-.67 0-1.7-.76-2.8-.74-1.44.02-2.77.84-3.51 2.13-1.5 2.6-.38 6.44 1.07 8.55.71 1.03 1.56 2.19 2.68 2.15 1.07-.04 1.48-.7 2.78-.7 1.3 0 1.67.7 2.8.67 1.16-.02 1.89-1.05 2.59-2.08.82-1.2 1.15-2.35 1.17-2.41-.03-.01-2.25-.86-2.27-3.44zM12.96 4.2c.59-.72.99-1.71.88-2.7-.85.03-1.88.57-2.49 1.28-.55.63-1.03 1.64-.9 2.6.95.08 1.92-.48 2.51-1.18z"/>
      </svg>
      <span>Apple</span>
    </button>

    <button class="social-btn">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <path d="M4.58 12.77a1.19 1.19 0 1 1-2.38 0 1.19 1.19 0 0 1 2.38 0zm.6 0a1.19 1.19 0 0 1 2.38 0v2.97a1.19 1.19 0 1 1-2.38 0v-2.97z" fill="#E01E5A"/>
        <path d="M6.37 4.58a1.19 1.19 0 1 1 0-2.38 1.19 1.19 0 0 1 0 2.38zm0 .6a1.19 1.19 0 0 1 0 2.38H3.39a1.19 1.19 0 1 1 0-2.38h2.98z" fill="#36C5F0"/>
        <path d="M14.62 6.37a1.19 1.19 0 1 1 2.38 0 1.19 1.19 0 0 1-2.38 0zm-.6 0a1.19 1.19 0 0 1-2.38 0V3.39a1.19 1.19 0 1 1 2.38 0v2.98z" fill="#2EB67D"/>
        <path d="M12.83 14.62a1.19 1.19 0 1 1 0 2.38 1.19 1.19 0 0 1 0-2.38zm0-.6a1.19 1.19 0 0 1 0-2.38h2.98a1.19 1.19 0 1 1 0 2.38h-2.98z" fill="#ECB22E"/>
      </svg>
      <span>Slack</span>
    </button>
  </div>

  <div class="login-footer-links">
    <a href="javascript:void(0)">Can't log in?</a>
    <span class="dot-sep">&bull;</span>
    <a href="javascript:void(0)" (click)="onSignupClick()">Create an account</a>
  </div>

  <div class="login-footer">
    <hr />
    <svg class="atlassian-logo" height="20" viewBox="0 0 198 32" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path fill="#6C6F77" d="M22.878 24.378 12.293 3.208c-.208-.458-.416-.541-.666-.541-.209 0-.459.083-.709.5-1.5 2.375-2.167 5.125-2.167 8 0 4.001 2.042 7.752 5.043 13.794.333.667.583.792 1.166.792h7.335c.542 0 .833-.208.833-.625 0-.208-.041-.333-.25-.75M7.501 14.377c-.833-1.25-1.083-1.334-1.292-1.334s-.333.083-.708.834L.208 24.46c-.166.334-.208.459-.208.625 0 .334.292.667.917.667h7.46c.5 0 .874-.416 1.083-1.208.25-1 .333-1.876.333-2.917 0-2.917-1.292-5.751-2.292-7.251z"></path>

    <div class="footer-links">
      <a href="javascript:void(0)">Privacy Policy</a>
      <span class="dot-sep">&bull;</span>
      <a href="javascript:void(0)">User Notice</a>

  </div>

  </div>

  <h5 class="lock-title">Choose an account to continue</h5>

  <div class="lock-body">
    <div class="account-card" (click)="onContinue()">
      <div class="avatar">{{ initials }}</div>
      <div class="account-info">
        <span class="account-name">{{ user?.displayName }}</span>
        <span class="account-email">{{ user?.email }}</span>
      </div>
    </div>

    <button class="continue-btn" (click)="onContinue()">Continue</button>

    <div class="action-links">
      <button class="link-btn" (click)="onUseAnotherAccount()">Use another account</button>
      <button class="link-btn" (click)="onRemoveAccount()">Remove account</button>
    </div>
  </div>

    <hr />

<div class="content-container">
  <div class="heading">
    <h2>select a color</h2>
    <button class="secondary-btn close-btn">
      <span class="icon-content">
        <img src="./assets/icon/close.svg" alt="" />
      </span>
    </button>
  </div>
  <app-tab
    [config]="{
      headings: ['Colors', 'Unsplash', 'Upload'],
      bodyPlaceholders: [colors, unsplash, upload],
    }"
  ></app-tab>
</div>
<div class="color-remover-btn-container">
  <button class="secondary-btn"></button>
</div>

<ng-template #colors>
  <div class="container color-container" appScrollBorder>
    <div class="color-select-container row-container">
      <h3 class="row-container-header">Solid colors</h3>
      <div class="row-pallete-container">
        <button class="pallete" [style.backgroundColor]="'#F0F1F2'"></button>
        <button class="pallete" [style.backgroundColor]="'#E9F2FE'"></button>
        <button class="pallete" [style.backgroundColor]="'#F8EEFE'"></button>

    <div class="gradient-select-container row-container">
      <h3 class="row-container-header">Gradients</h3>
      <div class="row-pallete-container">
        @for (number of gradients; track number) {
          <button class="pallete"></button>
        }
      </div>
    </div>
  </div>
</ng-template>

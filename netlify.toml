[build]
  command = "cd backend && npx prisma generate && cd .. && npm run build"
  publish = "dist/jira-clone"

[functions]
  directory = "netlify/functions"
  external_node_modules = ["express"]
  node_bundler = "esbuild"
  included_files = ["backend/src/generated/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA fallback — serve index.html for Angular routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
